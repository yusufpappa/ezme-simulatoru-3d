<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>💥 Ezme Simülatörü 3D</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; overflow:hidden; background:#0b0f16;
    font-family:"Segoe UI", system-ui, sans-serif; user-select:none; }
  canvas { display:block; touch-action:none; }
  .vig { position:fixed; inset:0; pointer-events:none; z-index:2;
    background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,10,.4) 100%); }
  #title { position:fixed; top:8px; left:50%; transform:translateX(-50%); z-index:6;
    font-size:clamp(16px,3vw,27px); font-weight:900; letter-spacing:1px; white-space:nowrap;
    background:linear-gradient(90deg,#ff5252,#ffd740,#ff5252); -webkit-background-clip:text;
    background-clip:text; color:transparent; filter:drop-shadow(0 2px 6px rgba(0,0,0,.6)); }
  #stats { position:fixed; top:10px; right:10px; z-index:6; display:flex; flex-direction:column; gap:5px; }
  .chip { background:rgba(13,18,28,.82); backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,.14);
    border-radius:12px; padding:6px 12px; color:#9fb2c8; font-size:12px; font-weight:700;
    box-shadow:0 4px 14px rgba(0,0,0,.35); min-width:180px; }
  .chip b { color:#fff; font-size:15px; float:right; }
  .bar { height:7px; background:rgba(255,255,255,.14); border-radius:4px; margin-top:5px; overflow:hidden; }
  #dmgFill { height:100%; width:0%; border-radius:4px; background:linear-gradient(90deg,#ffd740,#ff5252);
    transition:width .12s; }
  #banner { position:fixed; top:30%; left:50%; transform:translate(-50%,-50%) scale(.6); z-index:8;
    font-size:clamp(28px,6vw,64px); font-weight:900; color:#ffd740; white-space:nowrap; opacity:0;
    text-shadow:0 4px 0 #b8860b, 0 8px 24px rgba(0,0,0,.7); pointer-events:none; transition:all .25s; }
  #banner.show { opacity:1; transform:translate(-50%,-50%) scale(1); }
  #hint { position:fixed; bottom:118px; left:50%; transform:translateX(-50%); z-index:5; color:#cfe0f5;
    font-size:12px; background:rgba(10,14,22,.65); padding:5px 12px; border-radius:10px;
    transition:opacity 1s; white-space:nowrap; }
  #panel { position:fixed; bottom:0; left:0; right:0; z-index:7; padding:8px 10px 10px;
    background:linear-gradient(180deg, rgba(10,14,22,.0), rgba(10,14,22,.92) 40%);
    display:flex; flex-direction:column; gap:6px; }
  .row { display:flex; gap:6px; justify-content:center; flex-wrap:wrap; align-items:stretch; }
  .rowLabel { color:#7f93ab; font-size:10px; font-weight:800; letter-spacing:1.5px; text-align:center; margin-top:2px; }
  button { cursor:pointer; border:1px solid rgba(255,255,255,.16); border-radius:12px;
    background:rgba(30,40,58,.85); color:#e8f0fb; padding:7px 10px; font-size:12.5px; font-weight:800;
    font-family:inherit; transition:transform .08s, box-shadow .15s, background .15s; line-height:1.25; }
  button:hover { background:rgba(48,64,92,.95); transform:translateY(-1px); }
  button:active { transform:scale(.94); }
  button.sel { background:linear-gradient(180deg,#3d6fd6,#2b4fa0); border-color:#7aa5ff;
    box-shadow:0 0 0 2px rgba(122,165,255,.35), 0 4px 14px rgba(43,79,160,.6); }
  button small { display:block; font-size:10px; font-weight:700; color:#9fb2c8; }
  button.sel small { color:#cfe0ff; }
  #dropBtn { background:linear-gradient(180deg,#ff5f5f,#c62828); border-color:#ff9d9d; color:#fff;
    font-size:17px; padding:8px 26px; box-shadow:0 6px 18px rgba(198,40,40,.5); }
  #dropBtn:hover { background:linear-gradient(180deg,#ff7676,#d32f2f); }
  #clearBtn { background:rgba(56,64,74,.9); font-size:12px; }

  /* ---------- GEZEGEN PANELI (SOL) ---------- */
  #planetPanel { position:fixed; left:10px; top:58px; bottom:182px; z-index:6;
    display:flex; flex-direction:column; gap:3px; overflow-y:auto;
    background:rgba(10,14,22,.72); backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.12); border-radius:14px; padding:7px; width:118px;
    scrollbar-width:thin; box-shadow:0 4px 18px rgba(0,0,0,.35); }
  .pLabel { color:#7f93ab; font-size:9px; font-weight:800; letter-spacing:1.3px; text-align:center; flex-shrink:0; }
  #curG { color:#ffd740; font-size:10px; font-weight:800; text-align:center; margin:2px 0 4px; flex-shrink:0; }
  .pbtn { cursor:pointer; border:1px solid rgba(255,255,255,.14); border-radius:10px;
    background:rgba(30,40,58,.85); color:#e8f0fb; padding:4px 6px; font-size:11.5px;
    font-weight:700; font-family:inherit; text-align:left; line-height:1.3;
    transition:transform .08s, background .15s; display:flex; align-items:center; gap:6px;
    flex-shrink:0; }
  .pbtn:hover { background:rgba(48,64,92,.95); transform:translateX(2px); }
  .pbtn:active { transform:scale(.95); }
  .pbtn.sel { background:linear-gradient(90deg,#7b4fd6,#4a2f9e); border-color:#b39dff;
    box-shadow:0 0 0 2px rgba(179,157,255,.3), 0 4px 12px rgba(74,47,158,.5); }
  .pbtn .psym { font-size:15px; flex-shrink:0; }
  .pbtn .pinfo { display:flex; flex-direction:column; }
  .pbtn .pg { font-size:9px; color:#9fb2c8; font-weight:700; }
  .pbtn.sel .pg { color:#ddd0ff; }

  /* ---------- SAYFA GECIS + YARIS SONUCLARI ---------- */
  #pageBtn { position:fixed; right:12px; bottom:12px; z-index:9;
    background:linear-gradient(180deg,#2eaa5e,#1c7f45); border-color:#7fe8a8;
    font-size:14px; padding:8px 14px; box-shadow:0 6px 16px rgba(28,127,69,.55); }
  #pageBtn:hover { background:linear-gradient(180deg,#37c56d,#219953); }
  #raceStats { position:fixed; top:64px; left:50%; transform:translateX(-50%); z-index:6;
    display:none; gap:5px; flex-wrap:wrap; justify-content:center; max-width:96vw; }
  .raceChip { background:rgba(13,18,28,.88); backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.14); border-radius:9px; padding:5px 6px;
    color:#cfe0f5; font-size:11px; font-weight:700; line-height:1.35; }
  .raceChip b { color:#ffd740; }
</style>
</head>
<body>
<div class="vig"></div>
<div id="title">💥 EZME SİMÜLATÖRÜ 3D 💥</div>
<div id="stats">
  <div class="chip">Ezme Puanı <b id="scoreV">0</b></div>
  <div class="chip">Ezilen Cisim <b id="crushV">0 / 4</b></div>
  <div class="chip">Hedef Sağlamlığı <b id="hpV">%100</b>
    <div class="bar"><div id="dmgFill"></div></div>
  </div>
</div>
<div id="banner"></div>
<div id="planetPanel">
  <div class="pLabel">GEZEGEN SEÇ</div>
  <div id="curG">9.81 m/s²</div>
  <div id="planetList" style="display:flex;flex-direction:column;gap:4px"></div>
</div>
<div id="hint">🖱️ Sürükle: döndür • Tekerlek: yakınlaş • Cisim SABİT durur — gülleyi üstüne bırak ve ez!</div>
<div id="panel">
  <div class="rowLabel">EZİLECEK CİSMİ SEÇ</div>
  <div class="row" id="objRow"></div>
  <div class="rowLabel" style="margin-top:4px">EZME GÜLLESİ SEÇ (üstteki bölmeden düşer)</div>
  <div class="row" id="ballRow" style="margin-bottom:4px"></div>
  <div class="row">
    <button id="dropBtn">⬇️ BIRAK! <small>(boşluk tuşu)</small></button>
    <button id="clearBtn">🧹 Temizle <small>(R tuşu)</small></button>
    <button id="sndBtn">🔊 Ses: Açık <small>(M tuşu)</small></button>
  </div>
</div>
<button id="pageBtn">📄 Sayfa 2 <small>gezegen yarışı</small></button>
<div id="raceStats"></div>

<!-- ================= KUTUPHANELER ================= -->
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cannon@0.6.2/build/cannon.min.js"></script>

<script>
"use strict";
/* ================= SABITLER ================= */
const BALLS = [
  { id:"t10",  name:"Küçük Taş",  kg:10,  r:0.24, color:0x8d99ae },
  { id:"g30",  name:"Gülle",      kg:30,  r:0.32, color:0x2f3640 },
  { id:"g100", name:"Gülle",      kg:100, r:0.46, color:0x1e272e },
  { id:"g200", name:"Gülle",      kg:200, r:0.58, color:0x12181f },
  { id:"g500", name:"Gülle",      kg:500, r:0.76, color:0x0b0f13 },
];
const OBJS = [
  { id:"car",   name:"Araba",        hp:1800, scale:1.0 },
  { id:"tv",    name:"Televizyon",   hp:450,  scale:1.0 },
  { id:"ballon",name:"Hava Topu",    hp:300,  scale:1.0 },
  { id:"safe",  name:"Para Kasası",  hp:3200, scale:1.0 },
];
const G = 9.82, DROP_H = 7.2;

/* ================= GEZEGENLER ================= */
const PLANETS = [
  { id:"mercury", sym:"🌑", name:"Merkür",   g:3.70 },
  { id:"venus",   sym:"🌕", name:"Venüs",    g:8.87 },
  { id:"earth",   sym:"🌍", name:"Dünya",    g:9.81 },
  { id:"mars",    sym:"🔴", name:"Mars",     g:3.71 },
  { id:"jupiter", sym:"🟠", name:"Jüpiter",  g:24.79 },
  { id:"saturn",  sym:"🪐", name:"Satürn",   g:10.44 },
  { id:"uranus",  sym:"🔵", name:"Uranüs",   g:8.69 },
  { id:"neptune", sym:"🔷", name:"Neptün",   g:11.15 },
];
let currentPlanet = "earth";
// OYUN HISSI CARPANI: gercek degerler arasindaki fark ekranda az hissedildigi
// icin fizik motoruna uygulanan yercekimi abartilir (panelde gercek deger yazar).
// Dunya ~16.7, Jupiter ~42, Merkur ~6.3 m/s2 gibi hissedilir.
const G_BOOST = 1.7;
function planetG(id) {
  const p = PLANETS.find(x => x.id === id);
  return p ? p.g * G_BOOST : 9.81 * G_BOOST;
}

/* ================= SENDER ================= */
let scene, camera, renderer, world;
let camTheta = Math.PI/4, camPhi = 0.95, camDist = 11, camTarget = new THREE.Vector3(0,1,0);
let ballBodies = [], ballMeshes = [], targetGroup = null;
let selectedObj = "car", selectedBall = "g100";
let score = 0, crushedCount = 0, targetHP = 1800, targetMaxHP = 1800;
let cageParts = [], debris = [], coins = [], arenaBodies = [];
let dropCount = 0;

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b0f16);
  scene.fog = new THREE.Fog(0x0b0f16, 18, 46);
  camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 200);

  renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  // isiklar
  scene.add(new THREE.HemisphereLight(0x88aaff, 0x223044, 0.75));
  const sun = new THREE.DirectionalLight(0xffffff, 1.6);
  sun.position.set(8, 14, 6);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -16; sun.shadow.camera.right = 16;
  sun.shadow.camera.top = 16;  sun.shadow.camera.bottom = -16;
  sun.shadow.camera.far = 60;
  scene.add(sun);
  const rim = new THREE.DirectionalLight(0x6fa8ff, 0.5);
  rim.position.set(-10, 8, -8);
  scene.add(rim);
  window.sunLight = sun;

  // fizik dunyasi
  world = new CANNON.World();
  world.gravity.set(0, -planetG(currentPlanet), 0);
  world.broadphase = new CANNON.SAPBroadphase();
  world.allowSleep = true;

  buildGround();
  buildDropZone();   // ustte bolme + kilavuz raylar
  buildArenaWalls(); // arena siniri (cikislar engellenir)
  buildUI();
  makeTarget(selectedObj);

  addEventListener("resize", onResize);
  addEventListener("keydown", e => {
    if (e.code === "Space") { e.preventDefault(); dropBall(); }
    if (e.code === "KeyR") clearAll();
    if (e.code === "KeyM") toggleSound();
  });
  requestAnimationFrame(loop);
}

/* ================= ZEMIN ================= */
function buildGround() {
  const mat = new CANNON.Material("ground");
  const gm = new THREE.Mesh(
    new THREE.CylinderGeometry(30, 30, 0.6, 48),
    new THREE.MeshStandardMaterial({ color:0x2a3442, roughness:.92, metalness:.05 })
  );
  gm.position.y = -0.3;
  gm.receiveShadow = true;
  scene.add(gm);

  const mark = new THREE.Mesh(
    new THREE.RingGeometry(2.4, 2.6, 48),
    new THREE.MeshBasicMaterial({ color:0xffd740, transparent:true, opacity:.28, side:THREE.DoubleSide })
  );
  mark.rotation.x = -Math.PI/2;
  mark.position.y = 0.012;
  scene.add(mark);

  // grid yardimcisi
  const grid = new THREE.GridHelper(60, 60, 0x3a4a60, 0x1c2634);
  grid.position.y = 0.005;
  scene.add(grid);

  const gBody = new CANNON.Body({ mass:0 });
  gBody.addShape(new CANNON.Plane());
  gBody.quaternion.setFromEuler(-Math.PI/2, 0, 0);
  world.addBody(gBody);
}

/* ================= UST BOLME ================= */
function buildDropZone() {
  const grp = new THREE.Group();
  const steel = new THREE.MeshStandardMaterial({ color:0x8a97a8, metalness:.85, roughness:.35 });
  const dark  = new THREE.MeshStandardMaterial({ color:0x39434f, metalness:.6,  roughness:.5 });

  // taban: ortasi bos cerceve (gulle delikten duser)
  const fw = 1.45, fl = 4.6;
  [[-(fl/2-fw/2),0,fw,fl],[fl/2-fw/2,0,fw,fl],[0,-(fl/2-fw/2),fl-2*fw,fw],[0,fl/2-fw/2,fl-2*fw,fw]]
  .forEach(p => {
    const f = new THREE.Mesh(new THREE.BoxGeometry(p[2], 0.3, p[3]), dark);
    f.position.set(p[0], DROP_H + 1.6, p[1]);
    f.castShadow = f.receiveShadow = true;
    grp.add(f);
  });

  // yan duvarlar
  const wallMat = steel.clone();
  wallMat.transparent = true; wallMat.opacity = .55;
  [-2.15, 2.15].forEach(x => {
    const w = new THREE.Mesh(new THREE.BoxGeometry(0.25, 2.4, 4.6), wallMat);
    w.position.set(x, DROP_H + 2.75, 0);
    w.castShadow = true;
    grp.add(w);
  });
  [ -2.15, 2.15].forEach(z => {
    const w = new THREE.Mesh(new THREE.BoxGeometry(4.6, 2.4, 0.25), wallMat);
    w.position.set(0, DROP_H + 2.75, z);
    w.castShadow = true;
    grp.add(w);
  });

  // kizak raylari (yandan inen)
  const railMat = new THREE.MeshStandardMaterial({ color:0xffb300, metalness:.7, roughness:.3 });
  [-1.0, 1.0].forEach(x => {
    const rail = new THREE.Mesh(new THREE.BoxGeometry(0.09, DROP_H + 1.4, 0.09), railMat);
    rail.position.set(x, (DROP_H + 1.4)/2 + 0.2, 0);
    rail.castShadow = true;
    grp.add(rail);
  });

  // tepe ustasi yazisi
  const warn = new THREE.Mesh(
    new THREE.BoxGeometry(2.6, 0.34, 0.06),
    new THREE.MeshStandardMaterial({ color:0xffc400, emissive:0x332900 })
  );
  warn.position.set(0, DROP_H + 4.15, 2.2);
  grp.add(warn);

  grp.traverse(o => { if (o.isMesh) o.receiveShadow = true; });
  scene.add(grp);

  // fizik duvarlari (gulle asagi kayarken kenardan cikmasin)
  const pm = new CANNON.Material("cage");
  const mk = (x, z, sx, sz) => {
    const b = new CANNON.Body({ mass:0 });
    b.addShape(new CANNON.Box(new CANNON.Vec3(sx/2, 1.2, sz/2)));
    b.position.set(x, DROP_H + 2.75, z);
    world.addBody(b);
    cageParts.push(b);
  };
  mk(-2.15, 0, 0.25, 4.6); mk(2.15, 0, 0.25, 4.6);
  mk(0, -2.15, 4.6, 0.25); mk(0, 2.15, 4.6, 0.25);
  // taban (gulle yukari cikmasin)
  const topLid = new CANNON.Body({ mass:0 });
  topLid.addShape(new CANNON.Box(new CANNON.Vec3(2.3, 0.15, 2.3)));
  topLid.position.set(0, DROP_H + 4.15, 0);
  world.addBody(topLid);
  cageParts.push(topLid);
}

/* ================= ARENA SINIRI ================= */
function buildArenaWalls() {
  const R = 6.2, N = 8;
  const side = 2 * R * Math.tan(Math.PI / N) + 0.35;
  const glass = new THREE.MeshStandardMaterial({ color:0x7ec8ff, transparent:true, opacity:.1,
    roughness:.15, metalness:.2, side:THREE.DoubleSide, depthWrite:false });
  const edgeMat = new THREE.MeshStandardMaterial({ color:0x40c4ff, emissive:0x1a7fb8,
    roughness:.4, metalness:.6 });
  for (let i = 0; i < N; i++) {
    const a = i / N * Math.PI * 2 + Math.PI / N;
    const x = Math.sin(a) * R, z = Math.cos(a) * R;
    // gorunur cam panel
    const panel = new THREE.Mesh(new THREE.BoxGeometry(side, 1.7, 0.08), glass);
    panel.position.set(x, 0.85, z);
    panel.rotation.y = a;
    scene.add(panel);
    // parlak ust kenar cizgisi
    const edge = new THREE.Mesh(new THREE.BoxGeometry(side, 0.07, 0.12), edgeMat);
    edge.position.set(x, 1.72, z);
    edge.rotation.y = a;
    scene.add(edge);
    // gorunmez yuksek fizik duvari (yukaridan ziplayanlar da icerde kalir)
    const b = new CANNON.Body({ mass:0 });
    b.addShape(new CANNON.Box(new CANNON.Vec3(side/2, 8, 0.18)));
    b.position.set(x, 8, z);
    b.quaternion.setFromEuler(0, a, 0);
    world.addBody(b);
    arenaBodies.push(b);
  }
}

/* ================= HEDEF CISIM MODELLERI ================= */
function stdMat(c, rough=.6, metal=.2) {
  return new THREE.MeshStandardMaterial({ color:c, roughness:rough, metalness:metal });
}

function makeCar(g) {
  const paint = stdMat(0xd63031, .3, .65);
  const paintDark = stdMat(0xa61b1c, .35, .6);
  const glass = new THREE.MeshStandardMaterial({ color:0x9fc5ff, roughness:.06, metalness:.35,
    transparent:true, opacity:.62 });
  const chrome = stdMat(0xd8dde3, .18, .95);
  const rubber = stdMat(0x14181e, .95, .05);
  const rimMat = stdMat(0xc9ced6, .25, .9);

  // -- saşe ve kasa (katmanlı) --
  const lower = new THREE.Mesh(new THREE.BoxGeometry(2.7, .3, 1.3), paintDark);
  lower.position.y = .3; g.add(lower);
  const hood = new THREE.Mesh(new THREE.BoxGeometry(2.7, .3, 1.28), paint);
  hood.position.y = .58; g.add(hood);
  // burun eğimi
  const nose = new THREE.Mesh(new THREE.BoxGeometry(.45, .2, 1.24), paint);
  nose.position.set(-1.15, .5, 0); g.add(nose);
  const bumperF = new THREE.Mesh(new THREE.BoxGeometry(.16, .22, 1.34), stdMat(0x22262c,.7,.3));
  bumperF.position.set(-1.38, .38, 0); g.add(bumperF);
  const bumperR = new THREE.Mesh(new THREE.BoxGeometry(.16, .22, 1.34), stdMat(0x22262c,.7,.3));
  bumperR.position.set(1.38, .38, 0); g.add(bumperR);

  // -- kabin (camlı) --
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.5, .5, 1.14), paint);
  cabin.position.set(.15, .98, 0); g.add(cabin);
  // on cam
  const wsGeo = new THREE.BoxGeometry(.06, .46, 1.06);
  const ws = new THREE.Mesh(wsGeo, glass);
  ws.rotation.z = .38; ws.position.set(-.52, 1.03, 0); g.add(ws);
  // arka cam
  const rw = new THREE.Mesh(wsGeo, glass);
  rw.rotation.z = -.3; rw.position.set(.86, 1.02, 0); g.add(rw);
  // yan camlar
  [.56, -.56].forEach(z => {
    const sw = new THREE.Mesh(new THREE.BoxGeometry(1.34, .34, .05), glass);
    sw.position.set(.16, 1.06, z); g.add(sw);
  });
  // tavan
  const roof = new THREE.Mesh(new THREE.BoxGeometry(1.42, .07, 1.16), paint);
  roof.position.set(.15, 1.26, 0); g.add(roof);

  // -- tekerlek + jant + disk --
  const wheelGeo = new THREE.TorusGeometry(.30, .13, 12, 22);
  const rimGeo = new THREE.CylinderGeometry(.19, .19, .26, 14);
  const hubGeo = new THREE.SphereGeometry(.06, 10, 8);
  [[-.88, .68],[-.88,-.68],[.95, .68],[.95,-.68]].forEach(p => {
    const grp = new THREE.Group();
    const tire = new THREE.Mesh(wheelGeo, rubber);
    grp.add(tire);
    const rim = new THREE.Mesh(rimGeo, rimMat);
    rim.rotation.x = Math.PI/2; grp.add(rim);
    const hub = new THREE.Mesh(hubGeo, chrome);
    grp.add(hub);
    // jant kolları (spokes)
    for (let s = 0; s < 5; s++) {
      const sp = new THREE.Mesh(new THREE.BoxGeometry(.04, .3, .05), rimMat);
      sp.rotation.z = s * Math.PI * 2 / 5;
      sp.position.set(Math.cos(s*Math.PI*2/5)*.1, Math.sin(s*Math.PI*2/5)*.1, 0);
      grp.add(sp);
    }
    grp.rotation.y = Math.PI/2;
    grp.position.set(p[0], .31, p[1]);
    g.add(grp);
  });

  // -- farlar ve stoplar --
  [[-.06,.62,.42],[-.06,.62,-.42]].forEach(p => {
    const h = new THREE.Mesh(new THREE.BoxGeometry(.1, .12, .3),

function makeTarget(id) {
  // eskisini temizle
  if (targetGroup) {
    scene.remove(targetGroup);
    if (targetGroup.body) world.removeBody(targetGroup.body);
  }
  debris.forEach(d => { scene.remove(d.mesh); world.removeBody(d.body); });
  debris = []; coins.forEach(c => { scene.remove(c.mesh); world.removeBody(c.body); }); coins = [];

  // ONCELIKLI DUZELTME: merkezde duran gulleleri kaldir ki yeni cisim
  // iclerine dogup firlamasin — temiz bir sekilde alanin ortasında belirmesi icin
  for (let i = ballBodies.length - 1; i >= 0; i--) {
    const p = ballBodies[i].position;
    if (p.y < 4 && Math.hypot(p.x, p.z) < 2.8) {
      world.removeBody(ballBodies[i]);
      scene.remove(ballMeshes[i]);
      ballBodies.splice(i, 1);
      ballMeshes.splice(i, 1);
    }
  }

  const def = OBJS.find(o => o.id === id);
  const vis = new THREE.Group();
  let info;
  if (id === "car") info = makeCar(vis);
  else if (id === "tv") info = makeTV(vis);
  else if (id === "ballon") info = makeBalloon(vis);
  else info = makeSafe(vis);
  vis.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });

  // kok grup fizik kutlesinin merkezine oturur; model asagi hizalanir
  const root = new THREE.Group();
  root.add(vis);
  const halfH = info.sphere ? info.r : info.size.y/2;
  vis.position.y = -(halfH + 0.02);
  scene.add(root);
  targetGroup = root;

  const shape = info.sphere
    ? new CANNON.Sphere(info.r)
    : new CANNON.Box(new CANNON.Vec3(info.size.x/2, info.size.y/2, info.size.z/2));
  // SABIT CISIM: kütlesi 0 → yerinden hiç kımıldamaz, itilemez, düşmez.
  // Gülle üstüne düşer, cisim orada sabit şekilde ezilir.
  const body = new CANNON.Body({ mass:0 });
  body.addShape(shape);
  body.position.set(0, halfH + 0.02, 0);
  world.addBody(body);
  root.body = body;
  root.halfH = halfH;
  root.hp = targetHP = targetMaxHP = def.hp;
  root.objId = id;
  updateHUD();
}

/* ================= SES EFEKTLERI (Web Audio, dosyasiz) ================= */
let audioCtx = null, soundOn = true;
function getAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { return null; }
  }
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}
// beyaz gurultu tamponu
function nb(ctx, dur) {
  const len = Math.max(1, Math.floor(ctx.sampleRate * dur));
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  return buf;
}
// ana ses cikisi: compressor ile kisilmaya karsi korur, guvenli yukseltir
let masterOut = null;
function out(ctx) {
  if (!masterOut) {
    masterOut = ctx.createDynamicsCompressor();
    masterOut.threshold.value = -14;
    masterOut.knee.value = 24;
    masterOut.ratio.value = 8;
    masterOut.attack.value = 0.003;
    masterOut.release.value = 0.25;
    const mg = ctx.createGain();
    mg.gain.value = 1.8;              // genel ses gucu
    masterOut.connect(mg); mg.connect(ctx.destination);
  }
  return masterOut;
}
// yercekimi orani: dunya=1, merkur~0.38, jupiter~2.53
function gravRatio() { return planetG(currentPlanet) / (9.81 * G_BOOST); }
// filtrelenmis gurultu patlamasi
function noiseFx(ctx, dur, type, f0, f1, vol, decay) {
  const src = ctx.createBufferSource();
  src.buffer = nb(ctx, dur);
  const flt = ctx.createBiquadFilter();
  flt.type = type; flt.Q.value = 0.9;
  flt.frequency.setValueAtTime(f0, ctx.currentTime);
  if (f1 && f1 !== f0) flt.frequency.exponentialRampToValueAtTime(f1, ctx.currentTime + dur);
  const g = ctx.createGain();
  g.gain.setValueAtTime(vol, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + decay);
  src.connect(flt); flt.connect(g); g.connect(out(ctx));
  src.start();
}
// basit ton (frekans kaymasi ile)
function toneFx(ctx, type, f0, f1, dur, vol) {
  const o = ctx.createOscillator();
  o.type = type;
  o.frequency.setValueAtTime(f0, ctx.currentTime);
  if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, ctx.currentTime + dur);
  const g = ctx.createGain();
  g.gain.setValueAtTime(vol, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
  o.connect(g); g.connect(out(ctx));
  o.start(); o.stop(ctx.currentTime + dur + 0.05);
}
// metalik parciklar (armonik olmayan frekanslar = metal sesi)
function metalFx(ctx, base, n, vol, dur) {
  for (let i = 0; i < n; i++) {
    const f = base * (1 + i * 0.37 + Math.random() * 0.2);
    toneFx(ctx, "triangle", f, f * 0.98, dur * (0.5 + Math.random() * 0.5), vol / n * (1.5 - i / n));
  }
}

// 1) GULLE DUSUSU: yercekimine gore hiz/pes-tiz ayarli islama
//    gravRatio: merkur~0.38 (uzun+pes), dunya=1 (normal), jupiter~2.5 (kisa+tiz+yuksek)
function sfxWhoosh() {
  const ctx = getAudio(); if (!ctx || !soundOn) return;
  const gr = gravRatio();                       // 0.38 .. 2.53
  const dur = Math.max(0.32, 0.95 / Math.sqrt(gr));   // merkurde uzun, jupiterde cok kisa
  const fLo = 220 * Math.pow(gr, 0.35);         // merkurde pes, jupiterde tiz
  const fHi = 1600 * Math.pow(gr, 0.55);
  const vol = 0.14 * Math.pow(gr, 0.6);         // jupiterde belirgin yuksek
  const src = ctx.createBufferSource();
  src.buffer = nb(ctx, dur + 0.1);
  const bp = ctx.createBiquadFilter();
  bp.type = "bandpass"; bp.Q.value = 5;
  bp.frequency.setValueAtTime(fLo, ctx.currentTime);
  bp.frequency.exponentialRampToValueAtTime(fHi, ctx.currentTime + dur);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, ctx.currentTime);
  g.gain.linearRampToValueAtTime(vol, ctx.currentTime + dur * 0.5);
  g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
  src.connect(bp); bp.connect(g); g.connect(out(ctx));
  src.start();
}

// 2) CARPMA: agirliga + hiza + esya turune gore ses
function sfxImpact(kg, speed, objId) {
  const ctx = getAudio(); if (!ctx || !soundOn) return;
  const gr = gravRatio();   // merkur~0.38, dunya=1, jupiter~2.5
  const v = Math.min(0.65, (0.1 + kg / 900 + speed / 80) * (0.7 + gr * 0.3));
  toneFx(ctx, "sine", 85 + Math.min(100, kg / 5), 30, 0.3, v);  // tok govde darbesi
  if (objId === "car") {              // metal gurultusu
    noiseFx(ctx, 0.25, "bandpass", 1600, 900, v * 0.8, 0.25);
    metalFx(ctx, 520, 5, v * 0.5, 0.35);
  } else if (objId === "tv") {        // cam/plastik tikirtisi
    noiseFx(ctx, 0.18, "highpass", 2600, 2000, v * 0.7, 0.18);
    toneFx(ctx, "square", 1200, 400, 0.1, v * 0.25);
  } else if (objId === "ballon") {    // lastik pat-pat
    noiseFx(ctx, 0.15, "lowpass", 700, 300, v * 0.9, 0.16);
  } else {                            // kasa: agir metal gong
    metalFx(ctx, 240, 4, v * 0.7, 0.5);
    noiseFx(ctx, 0.2, "bandpass", 500, 300, v * 0.6, 0.22);
  }
}

// 3) PARCALANMA / EZILME sesi (esya turune gore)
function sfxCrush(objId) {
  const ctx = getAudio(); if (!ctx || !soundOn) return;
  if (objId === "car") {
    // dev metal ezilme: sub-bass patlama + gicirti + parca saglamasi
    toneFx(ctx, "sine", 90, 24, 1.0, 0.9);                    // sub-bass govde
    noiseFx(ctx, 1.2, "lowpass", 1200, 180, 0.85, 1.15);      // ana ezilme gurultusu
    metalFx(ctx, 320, 9, 0.55, 0.9);                          // metalik parciklar
    toneFx(ctx, "sawtooth", 180, 40, 0.8, 0.5);               // yirtilma
    setTimeout(() => { if (soundOn) {
      noiseFx(ctx, 0.3, "bandpass", 800, 400, 0.5, 0.3);
      metalFx(ctx, 500, 5, 0.4, 0.4);
    } }, 260);
    setTimeout(() => { if (soundOn) noiseFx(ctx, 0.25, "lowpass", 500, 200, 0.35, 0.25); }, 520);
  } else if (objId === "tv") {
    // cam patlamasi: keskin tus + ardisik kirilma + elektronik cirt
    toneFx(ctx, "sine", 110, 30, 0.7, 0.8);
    noiseFx(ctx, 0.5, "highpass", 3500, 2500, 0.75, 0.45);
    for (let i = 0; i < 8; i++) setTimeout(() => {
      if (soundOn) noiseFx(ctx, 0.12, "highpass", 3800, 3000, 0.42, 0.11);
    }, 40 + i * 55);
    toneFx(ctx, "sawtooth", 2400, 140, 0.4, 0.35);
    noiseFx(ctx, 0.7, "lowpass", 700, 160, 0.55, 0.65);
  } else if (objId === "ballon") {
    // POP!: ultra keskin patlama + hava kacisi + lastik sarsinti
    toneFx(ctx, "square", 1100, 50, 0.09, 1.0);
    noiseFx(ctx, 0.12, "highpass", 1800, 1100, 0.9, 0.12);
    toneFx(ctx, "sine", 85, 38, 0.5, 0.8);
    setTimeout(() => { if (soundOn) {
      noiseFx(ctx, 0.3, "lowpass", 600, 200, 0.4, 0.28);
      toneFx(ctx, "sine", 60, 32, 0.35, 0.35);
    } }, 90);
  } else {
    // kasa: dev metal gong + kilit kirilma + enkaz yikimi
    toneFx(ctx, "sine", 70, 22, 1.3, 1.0);
    metalFx(ctx, 150, 7, 0.85, 1.3);
    noiseFx(ctx, 1.1, "lowpass", 550, 110, 0.8, 1.0);
    setTimeout(() => { if (soundOn) {
      metalFx(ctx, 900, 4, 0.5, 0.25);
      noiseFx(ctx, 0.2, "bandpass", 1500, 900, 0.45, 0.18);
    } }, 140);
    setTimeout(() => { if (soundOn) noiseFx(ctx, 0.35, "lowpass", 400, 150, 0.4, 0.3); }, 480);
  }
}

function sfxCoins() {

  const mat = new THREE.MeshStandardMaterial({ color:def.color, roughness:.45, metalness:.75 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = mesh.receiveShadow = true;
  scene.add(mesh);

  const body = new CANNON.Body({ mass: def.kg });
  body.addShape(new CANNON.Sphere(def.r));
  body.position.set(0, DROP_H + 3.1, 0);
  body.linearDamping = .01;
  world.addBody(body);
  ballBodies.push(body); ballMeshes.push(mesh);
  body.tag = "ball"; body.kg = def.kg; body.ballDef = def;
  dropCount++;
  sfxWhoosh();   // dusus islama sesi

  // birakma asamasi: hedef ustunde yesil isik efekti
  const flash = new THREE.PointLight(0xffd740, 4, 6);
  flash.position.copy(mesh.position);
  scene.add(flash);
  setTimeout(() => scene.remove(flash), 350);
}

/* ================= HASAR & EZILME ================= */
function onHit(relVel, ballKg) {
  const energy = 0.5 * ballKg * relVel * relVel;   // kinetik enerji (Joule)
  const dmg = Math.max(3, energy * 0.06);          // dengeli: kasa sert, top yumusak
  targetHP = Math.max(0, targetHP - dmg);
  score += Math.round(dmg);
  updateHUD();
  shakeCam(Math.min(1, dmg/260));
  sfxImpact(ballKg, relVel, targetGroup ? targetGroup.objId : "car");  // carpma sesi
  if (targetHP <= 0) crushTarget();
}

function crushTarget() {
  if (!targetGroup || targetGroup.crushed) return;
  targetGroup.crushed = true;
  const def = OBJS.find(o => o.id === targetGroup.objId);
  showBanner("💥 " + def.name.toUpperCase() + " EZİLDİ! 💥");
  sfxCrush(targetGroup.objId);            // esyaya ozel parcalanma sesi
  score += Math.round(targetMaxHP * .5);
  crushedCount++;
  updateHUD();

  // hedefi fizikten cikar, parcalara ayir
  world.removeBody(targetGroup.body);
  scene.remove(targetGroup);
  spawnDebris(targetGroup);
  if (targetGroup.objId === "safe") { spawnCoins(); sfxCoins(); }
  targetGroup = null;

  // 2 sn sonra ayni cisim yeniden dogar
  setTimeout(() => {
    if (!targetGroup) {
      showBanner("🔄 " + def.name + " yeniden geldi!");
      makeTarget(selectedObj);
    }
  }, 2000);
}

function spawnDebris(srcGroup) {
  const src = [];
  srcGroup.traverse(o => { if (o.isMesh && o.geometry) src.push(o); });
  const count = Math.min(src.length, 14);
  const taken = new Set();
  for (let i = 0; i < count; i++) {
    let m = src[i];
    if (taken.has(m)) m = src[Math.floor(Math.random()*src.length)];
    taken.add(m);
    const piece = new THREE.Mesh(m.geometry, m.material);
    piece.castShadow = true;
    scene.add(piece);
    const s = m.getWorldPosition(new THREE.Vector3());
    // geometri merkezi modelin ortasinda olabilir; parca merkezini dunya konumuna tasi
    m.updateWorldMatrix(true, false);
    const sz = new THREE.Box3().setFromObject(m).getSize(new THREE.Vector3());
    const shape = new CANNON.Box(new CANNON.Vec3(Math.max(.05,sz.x/2), Math.max(.05,sz.y/2), Math.max(.05,sz.z/2)));
    const body = new CANNON.Body({ mass:2 });
    body.addShape(shape);
    body.position.set(s.x, s.y, s.z);
    body.velocity.set((Math.random()-.5)*7, 4+Math.random()*5, (Math.random()-.5)*7);
    body.angularVelocity.set(Math.random()*8-4, Math.random()*8-4, Math.random()*8-4);
    world.addBody(body);
    debris.push({ mesh:piece, body, ttl:9 });
  }
}

function spawnCoins() {
  const goldMat = new THREE.MeshStandardMaterial({ color:0xffd54f, roughness:.25, metalness:.95 });
  const geo = new THREE.CylinderGeometry(.11,.11,.035,12);
  for (let i=0;i<26;i++) {
    const c = new THREE.Mesh(geo, goldMat);
    c.castShadow = true; scene.add(c);
    const body = new CANNON.Body({ mass:.4 });
    body.addShape(new CANNON.Sphere(.09));
    body.position.set((Math.random()-.5)*1.2, 1.4+Math.random()*.8, (Math.random()-.5)*1.2);
    body.velocity.set((Math.random()-.5)*9, 5+Math.random()*6, (Math.random()-.5)*9);
    body.angularVelocity.set(Math.random()*14-7, Math.random()*14-7, Math.random()*14-7);
    world.addBody(body);
    coins.push({ mesh:c, body, ttl:12 });
  }
}

/* ================= KAMERA KONTROLU ================= */
let dragging = false, lastX = 0, lastY = 0, shakeT = 0, shakeAmt = 0;
function shakeCam(a) { shakeT = .35; shakeAmt = Math.max(shakeAmt, a); }

function onResize() {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
function bindControls() {
  const el = renderer.domElement;
  el.addEventListener("pointerdown", e => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
  addEventListener("pointermove", e => {
    if (!dragging) return;
    camTheta -= (e.clientX - lastX) * .0055;
    camPhi = Math.max(.12, Math.min(1.45, camPhi + (e.clientY - lastY) * .005));
    lastX = e.clientX; lastY = e.clientY;
  });
  addEventListener("pointerup", () => dragging = false);
  el.addEventListener("wheel", e => {
    e.preventDefault();
    camDist = Math.max(4, Math.min(28, camDist + e.deltaY * .012));
  }, { passive:false });
  // dokunmatik pinch zoom
  let pinchD = 0;
  el.addEventListener("touchstart", e => {
    if (e.touches.length === 2) pinchD = Math.hypot(
      e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
  });
  el.addEventListener("touchmove", e => {
    if (e.touches.length === 2 && pinchD > 0) {
      const d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
      camDist = Math.max(4, Math.min(28, camDist * (pinchD/d)));
      pinchD = d;
    }
  }, { passive:true });
}

/* ================= ANA DONGU ================= */
let lastT = performance.now(), hitCD = 0;
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min((now - lastT)/1000, .05);
  lastT = now;
  if (raceMode) {
    // yarisma: once dusuk yercekimiyle adimla, sonra ek kuvvetler uygulanir
    world.gravity.set(0, -3.7 * G_BOOST, 0);   // en dusuk gezegen (Merkur) tabani
    world.step(1/60, dt, 4);
    applyRaceGravity(dt);
    updateRaceStats(dt);
    updateCamera(dt);
    renderer.render(scene, camera);
    return;
  }
  world.step(1/60, dt, 4);

  // hedefe hasar tespiti
  hitCD -= dt;
  if (targetGroup && !targetGroup.crushed && hitCD <= 0 && targetGroup.body) {
    for (const b of ballBodies) {
      const dist = b.position.distanceTo(targetGroup.body.position);
      const reach = 1.1 + b.shapes[0].radius + (targetGroup.halfH || 1);
      const relV = b.velocity.norm() + targetGroup.body.velocity.norm();
      if (dist < reach && relV > 3.2) {
        onHit(Math.min(relV, 30), b.kg);
        hitCD = .22;
        break;
      }
    }
  }

  // gulle mesh senkron
  for (let i = ballBodies.length-1; i >= 0; i--) {
    const b = ballBodies[i], m = ballMeshes[i];
    m.position.copy(b.position); m.quaternion.copy(b.quaternion);
    if (b.position.y < -6 || b.position.norm() > 40) {
      world.removeBody(b); scene.remove(m);
      ballBodies.splice(i,1); ballMeshes.splice(i,1);
    }
  }

  // hedef senkron + kacis guvenligi
  if (targetGroup && targetGroup.body) {
    const p = targetGroup.body.position;
    // alandan kactiysa veya zeminin altina dustuysa yerine geri getir
    if (p.y < -1.5 || Math.hypot(p.x, p.z) > 6.5) {
      const keepHP = targetGroup.hp / targetMaxHP;   // hasar durumu korunur
      const id = targetGroup.objId;
      scene.remove(targetGroup);
      world.removeBody(targetGroup.body);
      targetGroup = null;
      makeTarget(id);
      targetHP = Math.max(1, Math.round(targetMaxHP * keepHP));
      targetGroup.hp = targetHP;
      updateHUD();
    } else {
      targetGroup.position.copy(targetGroup.body.position);
      targetGroup.quaternion.copy(targetGroup.body.quaternion);
    }
  }

  // enkaz & para omru
  for (let i = debris.length-1; i >= 0; i--) {
    const d = debris[i];
    d.mesh.position.copy(d.body.position);
    d.mesh.quaternion.copy(d.body.quaternion);
    d.ttl -= dt;
    if (d.ttl < 2) d.mesh.scale.setScalar(Math.max(.01, d.ttl/2));
    if (d.ttl <= 0) { scene.remove(d.mesh); world.removeBody(d.body); debris.splice(i,1); }
  }
  for (let i = coins.length-1; i >= 0; i--) {
    const c = coins[i];
    c.mesh.position.copy(c.body.position);
    c.mesh.quaternion.copy(c.body.quaternion);
    c.ttl -= dt;
    if (c.ttl <= 0) { scene.remove(c.mesh); world.removeBody(c.body); coins.splice(i,1); }
  }

  // kamera
  updateCamera(dt);
  renderer.render(scene, camera);
}

function updateCamera(dt) {
  let target = new THREE.Vector3(0, 1, 0);
  if (shakeT > 0) {
    shakeT -= dt;
    const k = shakeAmt * shakeT / .35;
    target = target.add(new THREE.Vector3(
      (Math.random()-.5)*k*.6, (Math.random()-.5)*k*.5, (Math.random()-.5)*k*.6));
    if (shakeT <= 0) shakeAmt = 0;
  }
  const sp = Math.sin(camPhi), cp = Math.cos(camPhi);
  camera.position.set(
    target.x + camDist * sp * Math.sin(camTheta),
    target.y + camDist * cp,
    target.z + camDist * sp * Math.cos(camTheta));
  camera.lookAt(target);
}

let raceMode = false, raceBalls = [], raceLabels = [], raceArrows = [];
let raceStart = 0, raceDone = false, raceWinnerShown = false;
let laneHP = {};   // serit bazli can: { planet, hp, maxHp }
const LANE_W = 2.05, LANE_X0 = -7.2, LANE_X1 = 7.2;   // 8 serit araligi

function enterRace() {
  raceMode = true;
  clearAll();
  // sahneyi temizle
  if (targetGroup) { scene.remove(targetGroup); world.removeBody(targetGroup.body); targetGroup = null; }
  ballBodies.forEach(b => world.removeBody(b)); ballBodies = [];
  ballMeshes.forEach(m => scene.remove(m)); ballMeshes = [];

  scene.fog = null;                                  // uzak seritler solmasin

}

function exitRace() {
  raceMode = false;
  raceBalls.forEach(r => { scene.remove(r.mesh); world.removeBody(r.body); });
  raceLanes.forEach(l => scene.remove(l)); raceLanes = [];
  raceBalls = [];
  raceLabels.forEach(l => scene.remove(l)); raceLabels = [];

  scene.fog = new THREE.Fog(0x0b0f16, 18, 46);    // normal moda sis geri gelsin

// serit tabani (gorsel)
let raceLanes = [];
function buildRaceScene() {
  raceLanes.forEach(l => scene.remove(l)); raceLanes = [];
  const groundMat = new THREE.MeshStandardMaterial({ color:0x223142, roughness:.9 });
  for (let i = 0; i < 8; i++) {
    const x = LANE_X0 + i * (LANE_X1 - LANE_X0) / 7;
    const lane = new THREE.Mesh(new THREE.BoxGeometry(LANE_W - .12, .1, 6), groundMat);
    lane.position.set(x, .05, 0); lane.receiveShadow = true;
    scene.add(lane); raceLanes.push(lane);
    // serit ayirici cizgi
    if (i > 0) {
      const line = new THREE.Mesh(new THREE.BoxGeometry(.06, .02, 6),
        new THREE.MeshBasicMaterial({ color:0xffd740, transparent:true, opacity:.35 }));
      line.position.set(x - LANE_W/2, .11, 0);
      scene.add(line); raceLanes.push(line);
    }
  }
}

// gezegen adini dunya uzayinda yaz (canvas dokusu ile)
function makeLabel(text, color) {
  const cnv = document.createElement("canvas");
  cnv.width = 256; cnv.height = 64;
  const c = cnv.getContext("2d");
  c.fillStyle = "rgba(8,12,18,.85)";
  c.roundRect ? (c.beginPath(), c.roundRect(0, 0, 256, 64, 12), c.fill()) : c.fillRect(0, 0, 256, 64);
  c.font = "bold 34px Segoe UI, sans-serif";
  c.textAlign = "center"; c.textBaseline = "middle";
  c.fillStyle = color;
  c.fillText(text, 128, 34);
  const tex = new THREE.CanvasTexture(cnv);
  const mat = new THREE.SpriteMaterial({ map:tex, transparent:true });
  const spr = new THREE.Sprite(mat);
  spr.scale.set(2.4, .6, 1);
  return spr;
}

// 8 seritte ayni cisim + ayni gulle, her seritte gezegenin yercekimi
function dropRace() {
  clearRaceBalls();
  const ballDef = BALLS.find(b => b.id === selectedBall);
  const objDef = OBJS.find(o => o.id === selectedObj);
  raceDone = false; raceWinnerShown = false;
  raceStart = performance.now();
  document.getElementById("raceStats").innerHTML = "";
  laneHP = {};   // serit canlari

  for (let i = 0; i < 8; i++) {
    const p = PLANETS[i];
    const x = LANE_X0 + i * (LANE_X1 - LANE_X0) / 7;
    // cisim (sabit, serit ortasinda)
    const g = new THREE.Group();
    let info;
    if (objDef.id === "car") info = makeCar(g);
    else if (objDef.id === "tv") info = makeTV(g);
    else if (objDef.id === "ballon") info = makeBalloon(g);
    else info = makeSafe(g);
    g.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    const halfH = info.sphere ? info.r : info.size.y/2;
    g.position.set(x, 0, 0);
    g.scale.setScalar(.78);   // serit icinde kalsin
    scene.add(g);
    // sabit fizik kutlesi
    const shape = info.sphere ? new CANNON.Sphere(info.r * .78)
      : new CANNON.Box(new CANNON.Vec3(info.size.x/2*.78, info.size.y/2*.78, info.size.z/2*.78));
    const tb = new CANNON.Body({ mass:0 });
    tb.addShape(shape);
    tb.position.set(x, halfH*.78 + .02, 0);
    world.addBody(tb);
    raceBalls.push({ type:"target", mesh:g, body:tb, planet:p, lane:i,
      hp:objDef.hp, maxHp:objDef.hp, crushed:false, halfH:halfH*.78 });

    // serit can barlari (istatistik cubugu) — ustte gosterilir
    laneHP[i] = { planet:p, hp:objDef.hp, maxHp:objDef.hp };

    // gulle
    const bm = new THREE.Mesh(new THREE.SphereGeometry(ballDef.r * .82, 18, 14),
      new THREE.MeshStandardMaterial({ color:ballDef.color, roughness:.45, metalness:.75 }));
    bm.castShadow = true; scene.add(bm);
    const bb = new CANNON.Body({ mass:ballDef.kg });
    bb.addShape(new CANNON.Sphere(ballDef.r * .82));
    bb.position.set(x, DROP_H + 3.1, 0);
    bb.linearDamping = .01;
    world.addBody(bb);
    raceBalls.push({ type:"ball", mesh:bm, body:bb, planet:p, lane:i,
      startY:DROP_H + 3.1, hitTime:null, impactSpeed:0 });

    // gezegen etiketi (cismin ustunde)
    const lbl = makeLabel(p.name, "#ffd740");
    lbl.position.set(x, halfH*.78 + 1.15 + (info.sphere ? .4 : .9), 0);
    scene.add(lbl); raceLabels.push(lbl);

    // dusus oku (gorsel)
    const arr = new THREE.Mesh(new THREE.ConeGeometry(.13, .4, 8),
      new THREE.MeshBasicMaterial({ color:0xff5252 }));
    arr.rotation.x = Math.PI;
    arr.position.set(x, DROP_H + 2.2, 0);
    scene.add(arr); raceArrows.push(arr);
  }
  // buton metnini yarisa gore guncelle
  document.getElementById("dropBtn").innerHTML =
    '⬇️ 8 GÜLLE BIRAK! <small>(boşluk tuşu)</small>';
  sfxWhoosh();
}

function clearRaceBalls() {
  raceBalls.forEach(r => { scene.remove(r.mesh); world.removeBody(r.body); });
  raceBalls = [];
  raceLabels.forEach(l => scene.remove(l)); raceLabels = [];
  raceArrows.forEach(a => scene.remove(a)); raceArrows = [];
}

// serit bazli yercekimi: ana dunya yercekimini en dusuge ayarla, sonra
// her gulle/cisim icin gezegen oranina gore ek kuvvet uygula
function applyRaceGravity(dt) {
  for (const r of raceBalls) {
    if (r.type !== "ball" || r.hitTime !== null) continue;
    const targetG = r.planet.g * G_BOOST;
    const currentG = 9.81 * G_BOOST;               // dunya yercekimi (motor)
    const extra = targetG - currentG;
    if (Math.abs(extra) > 0.01) r.body.applyForce(new CANNON.Vec3(0, -extra * r.body.mass, 0), r.body.position);
  }
}

// yarisma dongusu: GERCEK carpma tespiti + hasar + parcalanma + istatistik
function updateRaceStats(dt) {
  if (!raceMode || !raceBalls.length) return;
  applyRaceGravity(dt);

  const objDef = OBJS.find(o => o.id === selectedObj);
  let anyPending = false;
  let hpChanged = false;

  for (const r of raceBalls) {
    if (r.type === "target") {
      // cani biten cisimleri parcala
      if (!r.crushed && r.hp <= 0) {
        r.crushed = true;
        spawnDebris(r.mesh);                      // esya ozel enkaz
        sfxCrush(selectedObj);                    // esya ozel parcalanma sesi
        if (selectedObj === "safe") sfxCoins();
        scene.remove(r.mesh); world.removeBody(r.body);
        hpChanged = true;
      }
      continue;
    }
    // gulle mesh senkron
    r.mesh.position.copy(r.body.position);
    r.mesh.quaternion.copy(r.body.quaternion);

    if (r.hitTime !== null) continue;             // zaten carpti

    if (r.body.position.y > r.startY + 1.5) {     // henuz baslamadi (yukari firladiysa guvenlik)
      anyPending = true; continue;
    }
    // GERCEK carpma: gulle merkezi cismin ust yuzeyine degince
    const ballR = r.body.shapes[0].radius;
    const targets = raceBalls.filter(t => t.type === "target" && !t.crushed && t.lane === r.lane);
    const tgt = targets[0];
    if (tgt) {
      const tTop = tgt.body.position.y + tgt.halfH;    // cisim ust yuzeyi
      const speed = r.body.velocity.norm();
      if (r.body.position.y - ballR <= tTop && speed > 1.2) {
        // CARPTI! hiz fizikten, sure kronometreden
        r.impactSpeed = speed;
        r.hitTime = performance.now() - raceStart;
        // hasar: kinetik enerji ile ayni formul (sayfa 1 ile uyumlu)
        const energy = 0.5 * (BALLS.find(b => b.id === selectedBall).kg) * speed * speed;
        const dmg = Math.max(3, energy * 0.06);
        tgt.hp = Math.max(0, tgt.hp - dmg);
        laneHP[r.lane].hp = tgt.hp;
        hpChanged = true;
        sfxImpact(BALLS.find(b => b.id === selectedBall).kg, speed, selectedObj);
      } else { anyPending = true; }
    } else {
      // cisim yok (ezildi) — zemin seviyesini bekle
      if (r.body.position.y - ballR <= .13 || r.body.velocity.norm() < .4) {
        r.impactSpeed = r.body.velocity.norm();
        r.hitTime = performance.now() - raceStart;
      } else anyPending = true;
    }
  }
  raceArrows.forEach(a => { if (a.parent) a.visible = !raceDone; });

  // can barlarini ve istatistikleri guncelle (her zaman ustte)
  if (hpChanged || !raceDone) renderRaceStats();

  // tum gulleler carpti mi?
  if (anyPending) return;
  if (raceDone) return;
  raceDone = true;
  renderRaceStats();   // final tablo
}

// ust istatistik paneli: gezegen, sure, hiz, can
function renderRaceStats() {
  const el = document.getElementById("raceStats");
  const rows = PLANETS.map((p, i) => {
    const ball = raceBalls.find(r => r.type === "ball" && r.lane === i);
    const hp = laneHP[i] || { hp:0, maxHp:1 };
    const pct = Math.max(0, Math.round(hp.hp / hp.maxHp * 100));
    const time = ball && ball.hitTime !== null ? (ball.hitTime/1000).toFixed(2) + " sn" : "…";
    const spd  = ball && ball.hitTime !== null ? ball.impactSpeed.toFixed(1) + " m/s" : "…";
    const dead = pct <= 0 ? " opacity:.45;" : "";
    return '<div class="raceChip" style="' + dead + 'width:104px;text-align:center;">' +
      p.sym + "<br><b>" + p.name + "</b><br>" + time + " • " + spd +
      '<div style="height:5px;background:rgba(255,255,255,.15);border-radius:3px;margin-top:3px;overflow:hidden;">' +
      '<div style="height:100%;width:' + pct + '%;background:linear-gradient(90deg,#7fe8a8,#2eaa5e);"></div></div>' +
      '<span style="font-size:9px;color:#9fb2c8;">CAN %' + pct + "</span></div>";
  }).join("");
  el.innerHTML = rows;
}

/* ================= BASLAT ================= */
init();
bindControls();
